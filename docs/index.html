<h1>dcm4nifi – DICOM Toolkit for Apache NiFi</h1>

<p>
    dcm4nifi enables DICOM processing in Apache NiFi, including anonymization,
    compression, and AI-ready data pipelines.
</p>

<h2>Features</h2>
<ul>
    <li>DICOM anonymization</li>
    <li>HL7 processing</li>
    <li>PACS integration</li>
</ul>
